<title>Ardent Field</title>
<meta name="description" content="Clickable prototype of the Ardent field app, running on sample data." />
<style>
  :root { --bg: #070707; --frame: #121212; --hint: #5f5f5f; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #root { display: flex; flex: 1; height: 100%; width: 100%; max-width: 430px; position: relative; overflow: hidden; }
  #root, #root * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #root input, #root textarea { -webkit-user-select: text; user-select: text; }
  .hint { display: none; color: var(--hint); font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .04em; }
  @media (min-width: 600px) and (min-height: 760px) {
    body { background: radial-gradient(ellipse at 50% 40%, #161616 0%, var(--bg) 70%); }
    #root { flex: none; width: 390px; height: min(844px, calc(100% - 96px)); border-radius: 44px; box-shadow: 0 0 0 10px var(--frame), 0 40px 120px rgba(0,0,0,.7); }
    .hint { display: block; }
  }
</style>
<div id="root"></div>
<p class="hint">Sample data, nothing leaves this page. Pick someone to try it as. Press and hold the bars that ask you to.</p>
<script>
  (function () {
    var href = location.href.split('#')[0].split('?')[0];
    window.__AB = href.slice(0, href.lastIndexOf('/') + 1);
    __SCRIPTS__.forEach(function (f) {
      var s = document.createElement('script');
      s.src = window.__AB + 'js/' + f;
      s.async = false;
      document.body.appendChild(s);
    });
    // A long press must stay a hold, never open the browser's menu.
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    try { history.replaceState(null, '', '/'); } catch (e) {}
  })();
</script>
