<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Wave A4 — placeholder Open Graph image for /trust/:slug pages.
       Designers: replace /trust-og-default.png with a 1200x630 PNG export.
       This SVG is the design source of truth until the PNG ships. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d15"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Accent ring -->
  <circle cx="980" cy="315" r="180" fill="none" stroke="#e8772e" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="980" cy="315" r="140" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.25"/>
  <!-- Wordmark -->
  <text x="80" y="170" font-family="Plus Jakarta Sans, sans-serif" font-size="38" font-weight="600" fill="#606078" letter-spacing="6">SITESENTRIQ · TRUST</text>
  <text x="80" y="320" font-family="Plus Jakarta Sans, sans-serif" font-size="86" font-weight="700" fill="#f0f0f5" letter-spacing="-2">Continuous</text>
  <text x="80" y="420" font-family="Plus Jakarta Sans, sans-serif" font-size="86" font-weight="700" fill="#f0f0f5" letter-spacing="-2">compliance, verified.</text>
  <text x="80" y="500" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="400" fill="#9ca3af">One link · one score · refreshed daily</text>
  <!-- Score chip mock -->
  <rect x="800" y="265" width="360" height="100" rx="50" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="980" y="328" font-family="Plus Jakarta Sans, sans-serif" font-size="56" font-weight="700" fill="#22c55e" text-anchor="middle">92 / 100</text>
</svg>
